name: Compile JOSS Paper
on: [push, pull_request]
jobs:
  paper:
    runs-on: ubuntu-latest
    name: Generate PDF
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build PDF
        uses: openjournals/openjournals-pdf-generator@main
        with:
          paper_path: paper 
      - name: Upload PDF artifact
        uses: actions/artifacts@v4
        with:
          name: joss-paper
          path: '${{ steps.build-pdf.outputs.pdf_path }}'
